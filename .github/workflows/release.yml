name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Builds with read-only access and no stored git credentials: Gradle runs third-party code,
  # which must not be able to reach a token that can write releases.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: java

      - name: The tag is on master, matches the version, and has changelog notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master"
            exit 1
          fi
          declared=$(sed -n 's/^val version = "\(.*\)"$/\1/p' lumen/build.gradle.kts)
          if [ "$declared" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the version in lumen/build.gradle.kts ($declared)"
            exit 1
          fi
          scripts/changelog.sh "$version" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no notes for $version"
            exit 1
          fi

      - name: Lint and tests, with the line-coverage floor
        run: |
          ./gradlew --no-daemon :lumen:lintRelease
          scripts/coverage.sh --check

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must be set as repository secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen-release.keystore"

      - name: Release APK, signed with the release key
        env:
          LUMEN_REQUIRE_RELEASE_KEY: "1"
          LUMEN_KEYSTORE: ${{ runner.temp }}/lumen-release.keystore
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :lumen:assembleRelease

      - name: Stage the APK and notes, and drop the key
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp lumen/build/outputs/apk/release/lumen-release.apk "dist/lumen-${version}.apk"
          cp release-notes.md dist/
          rm -f "$RUNNER_TEMP/lumen-release.keystore"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="dist/lumen-${version}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag \
              --title "Lumen ${version}" --notes-file dist/release-notes.md
          fi
